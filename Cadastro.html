<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechSênior - Cadastro</title>

    <!-- Fonte -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->

    <link rel="stylesheet" href="Estilos - CSS/Padrão.css" />

    <link rel="stylesheet" href="Estilos - CSS/Cadastro.css" />

    <!-- Ícones -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <main class="cadastro">
      <section class="cadastro-container">
        <!-- VOLTAR -->

        <a href="index.html" class="voltar">
          <i class="fa-solid fa-arrow-left"></i>

          Voltar para o início
        </a>

        <!-- LOGO -->

        <div class="cadastro-logo">
          <img src="Imagens/Logotipo Sem Fundo.png" alt="Logo TechSênior" />
        </div>

        <!-- TÍTULO -->

        <div class="cadastro-titulo">
          <h1>Crie sua conta</h1>

          <p>Faça seu cadastro e comece a aprender tecnologia.</p>
        </div>

        <!-- FORMULÁRIO -->

        <form id="formCadastro" class="form-cadastro">
          <div class="campo">
            <label for="nome"> Nome completo </label>

            <div class="input-box">
              <i class="fa-solid fa-user"></i>

              <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
              />
            </div>
          </div>

          <div class="campo">
            <label for="email"> E-mail </label>

            <div class="input-box">
              <i class="fa-solid fa-envelope"></i>

              <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>
          </div>

          <div class="campo">
            <label for="senha"> Senha </label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="senha"
                placeholder="Crie uma senha"
                required
              />

              <button type="button" class="mostrar-senha" id="mostrarSenha">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="campo">
            <label for="confirmarSenha"> Confirmar senha </label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirme sua senha"
                required
              />
            </div>
          </div>

          <div class="termos">
            <input type="checkbox" id="aceitarTermos" />

            <label for="aceitarTermos">
              Eu aceito os

              <a href="Termos de Uso.html"> Termos de Uso </a>

              e a

              <a href="Política de Privacidade.html">
                Política de Privacidade
              </a>
            </label>
          </div>

          <button type="submit" class="btn-cadastro">Criar conta</button>
        </form>

        <!-- LOGIN -->

        <div class="login-link">
          <p>Já possui uma conta?</p>

          <a href="Login.html"> Entrar </a>
        </div>
      </section>
    </main>

    <script type="module" src="Script - Java/Cadastro.js"></script>
  </body>
</html>

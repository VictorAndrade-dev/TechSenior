<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechSênior - Esqueci minha Senha</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="Estilos - CSS/Padrão.css" />
    <link rel="stylesheet" href="Estilos - CSS/EsqueciSenha.css" />

    <!-- Ícones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  <script type="importmap">{"imports":{"firebase/data-connect":"https://www.gstatic.com/firebasejs/12.17.1/firebase-data-connect.js"}}</script>
</head>

  <body class="nav-v2">
    <main class="pagina-recuperacao auth-page">
      <section class="card-recuperacao">

        <!-- Logo / Nome -->
        <div class="auth-logo">
          <img src="Imagens/Logo-TechSenior-Light.svg" data-logo-tema alt="TechSênior" />
        </div>

        <!-- Título -->
        <div class="cabecalho-recuperacao">
          <h1>Esqueceu sua senha?</h1>

          <p>
            Não se preocupe! Informe seu e-mail e enviaremos
            as instruções para recuperar o acesso à sua conta.
          </p>
        </div>

        <!-- Formulário -->
        <form id="formRecuperacao" novalidate>

          <div class="campo">
            <label for="email">
              E-mail
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              autocomplete="email"
              maxlength="100"
              required
            />
          </div>

          <button
            type="submit"
            id="btnEnviar"
          >
            Enviar instruções
          </button>

        </form>

        <!-- Mensagem -->
        <div
          id="mensagem"
          class="mensagem"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <!-- Voltar -->
        <div class="voltar-login">
          <a href="Login.html">
            ← Voltar para o login
          </a>
        </div>

      </section>
    </main>

    <!-- JavaScript -->
    <script
      type="module"
      src="Script - Java/EsqueciSenha.js"
    ></script>
  <script type="module" src="Script - Java/Padrão.js"></script>
</body>
</html>

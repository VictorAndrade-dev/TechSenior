<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TechSênior - Redefinindo sua Senha</title>

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="Estilos - CSS/Padrão.css" />
    <link rel="stylesheet" href="Estilos - CSS/RedefinirSenha.css" />

    <!-- Ícones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  <script type="importmap">{"imports":{"firebase/data-connect":"https://www.gstatic.com/firebasejs/12.17.1/firebase-data-connect.js"}}</script>
</head>

  <body class="nav-v2">
    <main class="pagina-redefinicao auth-page">
      <section class="card-redefinicao">

        <!-- Logo -->
        <div class="auth-logo">
          <img src="Imagens/Logo-TechSenior-Light.svg" data-logo-tema alt="TechSênior" />
        </div>

        <!-- Cabeçalho -->
        <div class="cabecalho-redefinicao">
          <h1>Redefina sua senha</h1>

          <p>
            Crie uma nova senha para recuperar
            o acesso à sua conta.
          </p>
        </div>

        <!-- Formulário -->
        <form id="formRedefinicao">

          <!-- Nova senha -->
          <div class="campo">
            <label for="novaSenha">
              Nova senha
            </label>

            <input
              type="password"
              id="novaSenha"
              name="novaSenha"
              placeholder="Digite sua nova senha"
              autocomplete="new-password"
              minlength="10"
              maxlength="32"
              required
            />
          </div>

          <!-- Confirmar senha -->
          <div class="campo">
            <label for="confirmarSenha">
              Confirmar nova senha
            </label>

            <input
              type="password"
              id="confirmarSenha"
              name="confirmarSenha"
              placeholder="Digite a senha novamente"
              autocomplete="new-password"
              minlength="10"
              maxlength="32"
              required
            />
          </div>

          <!-- Botão -->
          <button
            type="submit"
            id="btnRedefinir"
          >
            Redefinir senha
          </button>

        </form>

        <!-- Mensagem -->
        <div
          id="mensagem"
          class="mensagem"
          aria-live="polite"
        ></div>

        <!-- Voltar -->
        <div class="voltar-login">
          <a href="Login.html">
            ← Voltar para o login
          </a>
        </div>

      </section>
    </main>

    <!-- JavaScript -->
    <script
      type="module"
      src="Script - Java/RedefinirSenha.js"
    ></script>
  <script type="module" src="Script - Java/Padrão.js"></script>
</body>
</html>

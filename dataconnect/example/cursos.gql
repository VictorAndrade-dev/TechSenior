# ==========================================
# CRIAR CURSO
# ==========================================

mutation CriarCurso(
  $nome: String!
  $descricao: String
  $dificuldade: String!
  $cargaHoraria: Int!
  $imagem: String
  $icone: String
  $ativo: Boolean!
) @auth(level: USER) @transaction {

  query
    @redact
    @check(
      expr: "response.query.usuarios.size() == 1"
      message: "Administrador não encontrado."
    ) {

    usuarios(
      where: {
        firebaseUid: { eq_expr: "auth.uid" }
      }
      limit: 1
    ) {
      tipoUsuario {
        nome @check(
          expr: "this == 'Administrador'"
          message: "Apenas administradores podem criar cursos."
        )
      }
    }
  }

  curso_insert(
    data: {
      nome: $nome
      descricao: $descricao
      dificuldade: $dificuldade
      cargaHoraria: $cargaHoraria
      imagem: $imagem
      icone: $icone
      ativo: $ativo
    }
  )
}



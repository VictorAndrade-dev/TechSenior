# ADMIN - LISTAR CURSOS
# ==========================================

query ListarCursosAdmin @auth(level: USER) {

  usuarios(
    where: {
      firebaseUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  )
    @redact
    @check(
      message: "Usuário administrativo não encontrado."
    ) {

    tipoUsuario {
      nome @check(
        expr: "this == 'Administrador'"
        message: "Apenas administradores podem acessar esta área."
      )
    }
  }

  cursos(
    orderBy: [
      { nome: ASC }
    ]
  ) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
    publicado
    criadoEm
    atualizadoEm
  }
}



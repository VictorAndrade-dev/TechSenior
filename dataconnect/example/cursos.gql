query ListarCursos @auth(level: PUBLIC) {
  cursos(
    where: {
      ativo: { eq: true }
    }
    orderBy: [
      { nome: ASC }
    ]
  ) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
  }
}

query BuscarCurso(
  $id: UUID!
) @auth(level: USER) {
  curso(id: $id) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
  }
}

query ListarModulosDoCurso(
  $cursoId: UUID!
) @auth(level: USER) {
  modulos(
    where: {
      cursoId: { eq: $cursoId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id
    nome
    descricao
    ordem
    duracaoMinutos
    imagem
  }
}

query ListarConteudosDoModulo(
  $moduloId: UUID!
) @auth(level: USER) {
  conteudoModulos(
    where: {
      moduloId: { eq: $moduloId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id
    tipo
    titulo
    conteudo
    url
    altTexto
    ordem
  }
}

mutation CriarCurso(
  $nome: String!
  $descricao: String
  $dificuldade: String!
  $cargaHoraria: Int!
  $imagem: String
  $icone: String
  $ativo: Boolean!
) @auth(level: USER) @transaction {

  query @redact {
    usuarios(
      where: {
        firebaseUid: { eq_expr: "auth.uid" }
      }
      limit: 1
    ) {
      tipoUsuario {
        nome @check(
          expr: "this == 'Administrador'"
          message: "Apenas administradores podem criar cursos."
        )
      }
    }
  }

  curso_insert(
    data: {
      nome: $nome
      descricao: $descricao
      dificuldade: $dificuldade
      cargaHoraria: $cargaHoraria
      imagem: $imagem
      icone: $icone
      ativo: $ativo
    }
  )
}



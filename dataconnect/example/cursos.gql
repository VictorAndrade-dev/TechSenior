query ListarCursos @auth(level: PUBLIC) {
  cursos(
    where: {
      ativo: { eq: true }
      publicado: { eq: true }
    }
    orderBy: [
      { nome: ASC }
    ]
  ) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
    publicado
  }
}


query BuscarCurso(
  $id: UUID!
) @auth(level: USER) {
  curso(id: $id) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
    publicado
  }
}


query ListarModulosDoCurso(
  $cursoId: UUID!
) @auth(level: USER) {
  modulos(
    where: {
      cursoId: { eq: $cursoId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id
    nome
    descricao
    ordem
    duracaoMinutos
    imagem
  }
}


query ListarConteudosDoModulo(
  $moduloId: UUID!
) @auth(level: USER) {
  conteudoModulos(
    where: {
      moduloId: { eq: $moduloId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id

# ==========================================
# ADMIN - CRIAR QUIZ
# ==========================================

mutation CriarQuiz(
  $cursoId: UUID!
  $moduloId: UUID
  $tipo: String!
) @auth(level: USER) @transaction {

  query
    @redact
    @check(
      expr: "response.query.usuarios.size() == 1"
      message: "Administrador não encontrado."
    ) {

    usuarios(
      where: {
        firebaseUid: { eq_expr: "auth.uid" }
      }
      limit: 1
    ) {
      tipoUsuario {
        nome @check(
          expr: "this == 'Administrador'"
          message: "Apenas administradores podem criar quizzes."
        )
      }
    }
  }

  # O curso serializa a criação, evitando dois quizzes finais ou de módulo.
  curso_update(id: $cursoId, data: {atualizadoEm_expr: "request.time"}) @redact @check
  contexto: query @redact @check(
    expr: "(vars.tipo == 'final' && vars.moduloId == null && response.contexto.finais.size() == 0) || (vars.tipo == 'modulo' && vars.moduloId != null && response.contexto.modulos.size() == 1 && response.contexto.doModulo.size() == 0)"
    message: "Quiz já existente ou vínculo entre curso, módulo e tipo inválido."
  ) {
    finais: quizzes(where: {cursoId: {eq: $cursoId}, moduloId: {isNull: true}, tipo: {eq: "final"}}, limit: 1) { id }
    modulos(where: {id: {eq: $moduloId}, cursoId: {eq: $cursoId}}, limit: 1) { id }
    doModulo: quizzes(where: {moduloId: {eq: $moduloId}, tipo: {eq: "modulo"}}, limit: 1) { id }
  }
  quiz_insert(
    data: {
      cursoId: $cursoId
      moduloId: $moduloId
      tipo: $tipo
    }
  )
}


# ==========================================
# ADMIN - EDITAR QUIZ
# ==========================================

mutation EditarQuiz(
  $id: UUID!
  $tipo: String!
) @auth(level: USER) @transaction {

  query
    @redact
    @check(
      expr: "response.query.usuarios.size() == 1"
      message: "Administrador não encontrado."
    ) {

    usuarios(
      where: {
        firebaseUid: { eq_expr: "auth.uid" }
      }
      limit: 1
    ) {
      tipoUsuario {
        nome @check(
          expr: "this == 'Administrador'"
          message: "Apenas administradores podem editar quizzes."
        )
      }
    }
  }

  contexto: query @redact {
    quiz(id: $id) @check {
      tipo @check(expr: "this == vars.tipo", message: "O tipo de um quiz não pode ser alterado.")
    }
  }
  quiz_update(
    id: $id
    data: {
      tipo: $tipo
      atualizadoEm_expr: "request.time"
    }
  )
}


# ==========================================
# ADMIN - CRIAR QUESTÃO
# ==========================================

mutation CriarQuestaoQuiz($quizId: UUID!, $pergunta: String!, $ordem: Int!) @auth(level: USER) @transaction {
  query @redact @check(expr: "response.query.usuarios.size() == 1", message: "Administrador não encontrado.") {
    usuarios(where: {firebaseUid: {eq_expr: "auth.uid"}}, limit: 1) {
      tipoUsuario { nome @check(expr: "this == 'Administrador'", message: "Apenas administradores podem realizar esta operação.") }
    }
  }
  # Serializa criações concorrentes no mesmo quiz antes de contar questões.
  quiz_update(id: $quizId, data: {atualizadoEm_expr: "request.time"}) @redact @check
  limites: query @redact @check(expr: "response.limites.quiz.tipo != 'final' || response.limites.questaoQuizs.size() < 15", message: "O teste final permite no máximo 15 questões.") {
    quiz(id: $quizId) { tipo }
    questaoQuizs(where: {quizId: {eq: $quizId}}, limit: 15) { id }
  }
  questaoQuiz_insert(data: {quizId: $quizId, pergunta: $pergunta, ordem: $ordem})
}



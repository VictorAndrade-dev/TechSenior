  cursos(
    where: {
      ativo: { eq: true }
      publicado: { eq: true }
    }
    orderBy: [
      { nome: ASC }
    ]
  ) {
    id
    nome
    descricao
    dificuldade
    cargaHoraria
    imagem
    icone
    ativo
    publicado
  }
}



query BuscarQuizDoModulo(
  $moduloId: UUID!
) @auth(level: USER) {
  quizzes(
    where: {
      moduloId: { eq: $moduloId }
      tipo: { eq: "modulo" }
    }
    limit: 1
  ) {
    id
    tipo
    moduloId
  }
}

query ListarQuestoesDoQuiz(
  $quizId: UUID!
) @auth(level: USER) {
  questaoQuizs(
    where: {
      quizId: { eq: $quizId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id
    pergunta
    ordem
  }
}

query ListarAlternativasDaQuestao(
  $questaoId: UUID!
) @auth(level: USER) {
  alternativaQuizs(
    where: {
      questaoId: { eq: $questaoId }
    }
    orderBy: [
      { ordem: ASC }
    ]
  ) {
    id
    texto
    correta
    explicacao
    ordem
  }
}